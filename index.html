<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeTasks | Type-Safe Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>✨ TypeTasks</h1>
      <p class="subtitle">Type-safe task management made effortless</p>
    </header>

    <div class="addrow">
      <input id="title" type="text" placeholder="What needs to be done?" autocomplete="off" />
      <select id="status">
        <option value="todo">todo</option>
        <option value="in-progress">in-progress</option>
        <option value="done">done</option>
      </select>
      <button id="add">Add Task</button>
    </div>

    <div id="chips" class="filter-chips">
      <button class="chip active" data-filter="all">All</button>
      <button class="chip" data-filter="todo">Todo</button>
      <button class="chip" data-filter="in-progress">In Progress</button>
      <button class="chip" data-filter="done">Done</button>
    </div>

    <ul id="list" class="task-list"></ul>
  </div>

//trigger pull request


  <!-- Load the compiled JS as a module -->
  <script type="module" src="app.js"></script>
</body>
</html>
